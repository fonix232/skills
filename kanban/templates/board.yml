# A board's settings: .ai/kanban/board.yml. See SKILL.md for every key.
name: Project
key: PRJ

# Each column is a folder of cards, left to right.
columns:
  - id: backlog
    title: Backlog
  - id: next
    title: Next
  - id: todo
    title: Ready to start
  - id: doing
    title: In progress
  - id: review
    title: In review
  - id: done
    title: Done

# The card fields, in the order the front matter and the page show them.
fields:
  - name: type
    label: Type
    kind: select
    options: [feature, bug, refactor, chore, docs, spike]
  - name: priority
    label: Priority
    kind: select
    marker: true
    options:
      - { value: P0, color: red }
      - { value: P1, color: amber }
      - { value: P2, color: blue }
      - { value: P3, color: gray }
  - name: effort
    label: Effort
    kind: select
    tile: true
    options: [XS, S, M, L, XL]
  - name: depends_on
    label: Depends on
    kind: cards

# What a new card starts with.
template: |
  What the card is for, in a sentence or two.

  ## Acceptance criteria

  - [ ] What has to be true for the card to be done

  ## Tasks

  - [ ] The work, broken down, in order

  ## Progress

  Not started.
